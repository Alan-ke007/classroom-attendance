server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: classroom-attendance
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/classroom_attendance?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.classroom.attendance.modules
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Jackson 配置
spring.jackson:
  date-format: yyyy-MM-dd HH:mm:ss
  time-zone: GMT+8
  default-property-inclusion: non_null

# 日志配置
logging:
  level:
    root: INFO
    com.classroom.attendance: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 文件上传配置
file:
  upload:
    path: E:/classroom-attendance/uploads  # 文件存储根目录（使用绝对路径）

# CORS 跨域来源白名单（逗号分隔）。生产必须显式配置为前端域名，例如 https://your-frontend.com。
# 开发环境本机 localhost/127.0.0.1 任意端口已在 CorsConfig 内置放行（兼容 Vite 5173 等），
# 故此处默认留空；切勿配置为 "*"。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# JWT 配置
# 密钥必须由环境变量/密钥管理（如 Vault/K8s Secret）注入，禁止硬编码。
# 未配置 JWT_SECRET 时应用启动失败（占位符无默认值）。
# 注意：本仓库历史中可能已提交过明文密钥，需用 git filter-repo 清理（本工具不执行该操作）。
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）

# 算法服务（人脸核验中转，变体 A：算法仅 extract，后端持 gallery 并做 1:1 判定）
# 密钥仅后端环境变量（NF1），缺省启动告警但不致命失败；mock 档用于本地联调（F10）。
algorithm:
  base-url: ${ALGORITHM_BASE_URL:http://localhost:5000}   # 仅后端→算法，localhost 受信(NF2)
  api-key: ${ALGORITHM_API_KEY:}                          # 仅后端环境变量(NF1)，缺省启动告警
  mock: ${ALGORITHM_MOCK:false}                            # F10 本地联调档
  connect-timeout-ms: ${ALGORITHM_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${ALGORITHM_READ_TIMEOUT_MS:8000}       # 呼应 NF3，<3s 目标
  threshold: ${ALGORITHM_FACE_THRESHOLD:0.4}               # 余弦相似度阈值，可调(§8)
  model: ${ALGORITHM_FACE_MODEL:buffalo_l}
